<article class="post project">
  <header class="post-head">
    <div class="wrap wrap-narrow">
      <p class="crumb mono"><a href="/work/">work</a> <span aria-hidden="true">/</span> {{status}}</p>
      <h1>{{title}}</h1>
      <p class="lede">{{summary}}</p>
      {{specs}}
    </div>
  </header>

  <div class="wrap wrap-narrow post-body prose">
    {{body}}
  </div>

  <footer class="wrap wrap-narrow post-foot">
    <a class="more" href="/work/">&larr; All work</a>
  </footer>
</article>
