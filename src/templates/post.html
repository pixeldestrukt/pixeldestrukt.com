<article class="post">
  <header class="post-head">
    <div class="wrap wrap-narrow">
      <p class="crumb mono"><a href="/notes/">notes</a> <span aria-hidden="true">/</span> <time datetime="{{isoDate}}">{{date}}</time></p>
      <h1>{{title}}</h1>
      <p class="lede">{{summary}}</p>
      <p class="post-meta mono">{{readingTime}} min read{{tagList}}</p>
    </div>
  </header>

  <div class="wrap wrap-narrow post-body prose">
    {{body}}
  </div>

  <footer class="wrap wrap-narrow post-foot">
    {{pager}}
  </footer>
</article>
